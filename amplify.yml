version: 1
backend:
  phases:
    build:
      commands:
        # npm ci needs package-lock.json; until the repo has one, install from package.json
        - if [ -f package-lock.json ]; then npm ci --cache .npm --prefer-offline; else npm install --cache .npm --no-audit --no-fund; fi
        # deploys amplify/backend.ts (Cognito, timeline, Aurora) and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
        - npm run db:migrate
frontend:
  phases:
    build:
      commands:
        # ARNs and flags only (no secret values), so the SSR runtime can read them
        - env | grep -E '^RV_' > .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
