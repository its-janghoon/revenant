version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # deploys amplify/backend.ts (Cognito, timeline, Aurora) and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
        - npm run db:migrate
frontend:
  phases:
    build:
      commands:
        # ARNs and flags only (no secret values), so the SSR runtime can read them
        - env | grep -E '^RV_' > .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
