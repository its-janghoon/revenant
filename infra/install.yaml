AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Revenant install. Creates the Amplify app for Revenant, its IAM roles, secrets and a
  budget alarm. The first Amplify build deploys Revenant's backend (amplify/backend.ts).
  No GitHub token: a one-off CodeBuild job copies the public repository into a
  CodeCommit repository in this account, and Amplify builds from there.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Revenant }
        Parameters: [KiroApiKey, AdminEmail, Budget]
      - Label: { default: Advanced }
        Parameters: [SourceRepo, SourceBranch, Demo]

Parameters:
  KiroApiKey:
    Type: String
    NoEcho: true
    MinLength: 10
    Description: Company Kiro API key. Stored in Secrets Manager, used by build runs.
  AdminEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Admin email. Gets the Cognito invite and the budget alarms.
  Budget:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Monthly budget in USD for this account. You get an email at 80% and when the forecast passes it.
  SourceRepo:
    Type: String
    Default: https://github.com/its-janghoon/revenant.git
    Description: Public Git repository to install from.
  SourceBranch:
    Type: String
    Default: main
  Demo:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: Demo install for judges (projects are deleted after 24 hours).

Resources:
  # ---------- secrets ----------
  KiroSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rv-revenant-kiro
      Description: Revenant company Kiro API key
      SecretString: !Ref KiroApiKey
      Tags: [{ Key: revenant:app, Value: revenant }]

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rv-revenant-appkey
      Description: Revenant app key for machine callers (runner, Kiro Crew app), sent as x-rv-key
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }
      Tags: [{ Key: revenant:app, Value: revenant }]

  # ---------- source: a copy of the public repository in CodeCommit ----------
  SourceRepository:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: rv-revenant
      RepositoryDescription: Revenant source, copied from the public repository. Re-run the rv-revenant-seed build to update.
      Tags: [{ Key: revenant:app, Value: revenant }]

  # ---------- Amplify roles ----------
  # Service role: runs the Amplify build (ampx pipeline-deploy, CDK, migrations).
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rv-revenant-service-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: amplify.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmplifyBackendDeployFullAccess
      Policies:
        - PolicyName: source-and-migrations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codecommit:GitPull
                Resource: !GetAtt SourceRepository.Arn
              - Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement, rds-data:BeginTransaction, rds-data:CommitTransaction, rds-data:RollbackTransaction]
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-revenant-*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-revenant-*-db-*

  # Compute role: what the Revenant server (Next.js SSR) may do. Lanes list what they need; lane X adds it here.
  ComputeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rv-revenant-compute-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: amplify.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: revenant
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnDatabase
                Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement, rds-data:BeginTransaction, rds-data:CommitTransaction, rds-data:RollbackTransaction]
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-revenant-*
              - Sid: OwnSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-revenant-*
              - Sid: UserKiroKeys
                Effect: Allow
                Action: [secretsmanager:CreateSecret, secretsmanager:PutSecretValue, secretsmanager:DeleteSecret, secretsmanager:TagResource, secretsmanager:DescribeSecret]
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv/kiro/*
              - Sid: Timeline
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rv-revenant-*-timeline
              - Sid: AppRepos
                Effect: Allow
                Action: [codecommit:CreateRepository, codecommit:GetRepository, codecommit:GetBranch, codecommit:GetFile, codecommit:GetFolder, codecommit:CreateCommit, codecommit:CreateBranch, codecommit:GetDifferences, codecommit:MergeBranchesByFastForward, codecommit:MergeBranchesBySquash, codecommit:TagResource, codecommit:GetCommit, codecommit:GetMergeOptions, codecommit:DeleteRepository]
                Resource: !Sub arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:rv-*
              - Sid: Runs
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:StopBuild, codebuild:BatchGetBuilds, codebuild:ListBuildsForProject]
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/rv-*
              - Sid: CostRead
                Effect: Allow
                Action: [ce:GetCostAndUsage, ce:GetCostForecast, ce:UpdateCostAllocationTagsStatus]
                Resource: "*" # Cost Explorer has no resource-level permissions
                Condition:
                  StringEquals: { aws:RequestedRegion: us-east-1 }
              - Sid: Users
                Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminDisableUser, cognito-idp:AdminEnableUser, cognito-idp:AdminDeleteUser, cognito-idp:AdminAddUserToGroup, cognito-idp:AdminRemoveUserFromGroup, cognito-idp:ListUsers, cognito-idp:AdminListGroupsForUser]
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
                Condition:
                  StringEquals: { aws:ResourceTag/revenant:app: revenant }
              - Sid: Prompts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::rv-revenant-*-prompts-${AWS::AccountId}-${AWS::Region}/runs/*
              # Generated apps on Amplify Hosting (lane L2). CreateApp must carry revenant:project;
              # Revenant's own app is denied in ComputeRoleOwnApp below.
              - Sid: AppsCreate
                Effect: Allow
                Action: amplify:CreateApp
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/*
                Condition:
                  "Null": { aws:RequestTag/revenant:project: "false" }
              - Sid: Apps
                Effect: Allow
                Action: [amplify:GetApp, amplify:UpdateApp, amplify:DeleteApp, amplify:CreateBranch, amplify:GetBranch, amplify:UpdateBranch, amplify:DeleteBranch, amplify:ListBranches, amplify:StartJob, amplify:StopJob, amplify:GetJob, amplify:ListJobs, amplify:CreateDomainAssociation, amplify:GetDomainAssociation, amplify:ListDomainAssociations, amplify:UpdateDomainAssociation, amplify:DeleteDomainAssociation, amplify:TagResource, amplify:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/*
              - Sid: AppsPassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt AppsServiceRole.Arn, !GetAtt AppsComputeRole.Arn]
                Condition:
                  StringEquals: { iam:PassedToService: amplify.amazonaws.com }
              # Per-app runner roles rv-<app>-runner (runner/role.ts): only with the runner
              # boundary and only the runner base policy attached (amplify/backend.ts).
              - Sid: RunnerRoles
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rv-*-runner
                Condition:
                  ArnLike: { iam:PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/rv-revenant-*-runner-boundary" }
              - Sid: RunnerRolesAttach
                Effect: Deny
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rv-*-runner
                Condition:
                  ArnNotLike: { iam:PolicyARN: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/rv-revenant-*-runner-base" }
              - Sid: RunnerRolesRead
                Effect: Allow
                Action: [iam:GetRole, iam:GetRolePolicy, iam:ListAttachedRolePolicies, iam:ListRolePolicies, iam:TagRole, iam:DeleteRole]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rv-*-runner
              - Sid: RunnerPassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rv-*-runner
                Condition:
                  StringEquals: { iam:PassedToService: codebuild.amazonaws.com }
              # One AppRegistry application per app, for myApplications (lane L6).
              - Sid: AppRegistry
                Effect: Allow
                Action: [servicecatalog:CreateApplication, servicecatalog:GetApplication, servicecatalog:UpdateApplication, servicecatalog:DeleteApplication, servicecatalog:TagResource, servicecatalog:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:servicecatalog:${AWS::Region}:${AWS::AccountId}:/applications/*
              - Sid: TagsRead
                Effect: Allow
                Action: [tag:GetResources, tag:GetTagKeys, tag:GetTagValues]
                Resource: "*" # the Resource Groups Tagging API has no resource-level permissions
              # Failure logs for repair and run views (lanes L4, L5).
              - Sid: LogsRead
                Effect: Allow
                Action: [logs:FilterLogEvents, logs:GetLogEvents, logs:DescribeLogStreams]
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/rv/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/rv-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/amplify-*
              - Sid: StacksRead
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:ListStackResources, cloudformation:DeleteStack]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/amplify-*
              # Health-check failures and repair rules (lane L4).
              - Sid: Events
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
                Condition:
                  StringEquals: { events:source: revenant.deploy } # lib/repair/events.ts HEALTH_SOURCE
              # SQL apps (lib/data): Revenant owns each app's rv-<app>-<prod|dev>-db stacks, runs
              # admin SQL on those clusters, snapshots prod before a publish, serves pg_dump files.
              - Sid: SqlStacks
                Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DescribeStacks]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rv-*-db/*
              - Sid: SqlStackRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DbStackRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: cloudformation.amazonaws.com }
              - Sid: SqlData
                Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement]
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-*
              - Sid: SqlSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-*-db-*
              - Sid: SqlSnapshots
                Effect: Allow
                Action: [rds:CreateDBClusterSnapshot, rds:DescribeDBClusterSnapshots, rds:DescribeDBClusters, rds:AddTagsToResource]
                Resource:
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-*
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:rv-*
              - Sid: SqlDumps
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::rv-*-db-dumpbucket*/dumps/*
              # Record counts of the generated apps' Amplify Data tables (publish plan, Data tab).
              - Sid: AppTables
                Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*
              - Sid: AppTableNames
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/rv/*
              - Sid: EventRules
                Effect: Allow
                Action: [events:DescribeRule, events:EnableRule, events:DisableRule]
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/rv-revenant-*

  # Separate from ComputeRole: App needs the role's ARN, this needs App's id.
  ComputeRoleOwnApp:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref ComputeRole
      PolicyName: not-revenant-itself
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action: amplify:*
            Resource:
              - !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${App.AppId}
              - !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${App.AppId}/*

  # Service role of every generated app's Amplify build (ampx pipeline-deploy, CDK, migrations).
  AppsServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rv-apps-service-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: amplify.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmplifyBackendDeployFullAccess
      Policies:
        - PolicyName: source-and-migrations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codecommit:GitPull
                Resource: !Sub arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:rv-*
              - Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement, rds-data:BeginTransaction, rds-data:CommitTransaction, rds-data:RollbackTransaction]
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-*-db-*
              - Effect: Deny
                Action: [rds-data:*, secretsmanager:*, codecommit:*]
                Resource:
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-revenant-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-revenant-*
                  - !GetAtt SourceRepository.Arn

  # SSR compute role of every generated app (Amplify Hosting), RV_APPS_COMPUTE_ROLE_ARN.
  # It starts with no permissions; blocks/ai.ts and blocks/db add the app's own grants from
  # its backend. The boundary is the most any generated app's server can ever do, and never
  # reaches Revenant's own database, secrets or source.
  AppsComputeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub rv-apps-compute-boundary-${AWS::Region}
      Description: Permissions boundary of the generated apps' SSR compute role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource: "*" # blocks/ai.ts lists the model ARNs on the role itself
          - Effect: Allow
            Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement, rds-data:BeginTransaction, rds-data:CommitTransaction, rds-data:RollbackTransaction]
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-*
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-*-db-*
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
            Resource: "*"
          - Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters]
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/*
          - Effect: Deny
            Action: ["rds-data:*", "secretsmanager:*", "codecommit:*"]
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-revenant-*
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-revenant-*
              - !GetAtt SourceRepository.Arn

  AppsComputeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rv-apps-compute-${AWS::Region}
      Description: SSR compute role of the apps Revenant builds
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: amplify.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      PermissionsBoundary: !Ref AppsComputeBoundary
      Tags: [{ Key: revenant:app, Value: revenant }]

  # CloudFormation role for the SQL apps' rv-<app>-<prod|dev>-db stacks (blocks/db/cluster.ts),
  # RV_DB_STACK_ROLE_ARN: VPC, Aurora, its secret, the pg_dump CodeBuild project and bucket.
  DbStackRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rv-apps-db-stack-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: db-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["ec2:*Vpc*", "ec2:*Subnet*", "ec2:*RouteTable*", "ec2:*SecurityGroup*", "ec2:*VpcEndpoint*", ec2:DescribeAvailabilityZones, ec2:DescribePrefixLists, ec2:CreateTags, ec2:DeleteTags, ec2:Describe*]
                Resource: "*" # EC2 creates need "*" before the resource exists
              - Effect: Allow
                Action: ["rds:*"]
                Resource:
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-*
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:*
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster-pg:*
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:*
              - Effect: Deny
                Action: ["rds:*"]
                Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:rv-revenant-*
              - Effect: Allow
                Action: ["secretsmanager:*"]
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rv-*-db-*
              - Effect: Allow
                Action: [secretsmanager:GetRandomPassword]
                Resource: "*"
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:TagRole, iam:UntagRole, iam:PassRole]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rv-*-db-*
              - Effect: Allow
                Action: [iam:CreateServiceLinkedRole]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/rds.amazonaws.com/*
              - Effect: Allow
                Action: ["codebuild:*"]
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/rv-*
              - Effect: Allow
                Action: ["s3:*"]
                Resource: [!Sub "arn:${AWS::Partition}:s3:::rv-*-db-*", !Sub "arn:${AWS::Partition}:s3:::rv-*-db-*/*"]

  # ---------- the Revenant app ----------
  App:
    Type: AWS::Amplify::App
    Properties:
      Name: revenant
      Description: Revenant, Lovable on your own AWS account
      Repository: !GetAtt SourceRepository.CloneUrlHttp
      Platform: WEB_COMPUTE
      IAMServiceRole: !GetAtt ServiceRole.Arn
      ComputeRoleArn: !GetAtt ComputeRole.Arn
      # ARNs and flags only. amplify.yml copies RV_* into .env.production for the server.
      EnvironmentVariables:
        - { Name: ADMIN_EMAIL, Value: !Ref AdminEmail }
        - { Name: RV_KIRO_SECRET_ARN, Value: !Ref KiroSecret }
        - { Name: RV_APP_SECRET_ARN, Value: !Ref AppSecret }
        - { Name: RV_BUDGET_USD, Value: !Ref Budget }
        - { Name: RV_DEMO, Value: !Ref Demo }
        - { Name: RV_APPS_SERVICE_ROLE_ARN, Value: !GetAtt AppsServiceRole.Arn }
        - { Name: RV_APPS_COMPUTE_ROLE_ARN, Value: !GetAtt AppsComputeRole.Arn }
        - { Name: RV_DB_STACK_ROLE_ARN, Value: !GetAtt DbStackRole.Arn }
      Tags: [{ Key: revenant:app, Value: revenant }]

  MainBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt App.AppId
      BranchName: main
      Framework: Next.js - SSR
      Stage: PRODUCTION
      EnableAutoBuild: true
      Tags: [{ Key: revenant:app, Value: revenant }]

  # ---------- budget ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub rv-revenant-${AWS::Region}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref Budget, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AdminEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AdminEmail }]

  # ---------- seed: CDK bootstrap, copy the source, start the first build ----------
  # Amplify Gen 2 needs the account and region bootstrapped for CDK; pipeline-deploy does
  # not do it, so the seed job runs `cdk bootstrap` (no-op when already bootstrapped).
  SeedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: seed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/rv-revenant-seed*
              - Effect: Allow
                Action: [codecommit:GitPush, codecommit:GitPull]
                Resource: !GetAtt SourceRepository.Arn
              - Effect: Allow
                Action: [amplify:ListJobs, amplify:StartJob]
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${App.AppId}/branches/main/jobs/*
              - Sid: CdkBootstrap
                Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/CDKToolkit/*
              - Effect: Allow
                Action: [iam:CreateRole, iam:GetRole, iam:TagRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:DeleteRolePolicy, iam:UpdateAssumeRolePolicy, iam:PassRole]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-*
              - Effect: Allow
                Action: [s3:CreateBucket, s3:PutBucketPolicy, s3:GetBucketPolicy, s3:PutBucketVersioning, s3:PutEncryptionConfiguration, s3:PutBucketPublicAccessBlock, s3:PutLifecycleConfiguration, s3:GetBucketLocation, s3:PutBucketTagging]
                Resource: !Sub arn:${AWS::Partition}:s3:::cdk-*
              - Effect: Allow
                Action: [ecr:CreateRepository, ecr:DescribeRepositories, ecr:SetRepositoryPolicy, ecr:PutLifecyclePolicy, ecr:PutImageTagMutability, ecr:PutImageScanningConfiguration, ecr:TagResource]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/cdk-*
              - Effect: Allow
                Action: [ssm:PutParameter, ssm:GetParameter, ssm:GetParameters, ssm:AddTagsToResource]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/*
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*" # GetCallerIdentity has no resource; it reveals only the caller

  Seed:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: rv-revenant-seed
      Description: Copies Revenant from the public repository into CodeCommit and starts the Amplify build. Re-run to update Revenant.
      ServiceRole: !GetAtt SeedRole.Arn
      TimeoutInMinutes: 30
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        EnvironmentVariables:
          - { Name: SOURCE_REPO, Value: !Ref SourceRepo }
          - { Name: SOURCE_BRANCH, Value: !Ref SourceBranch }
          - { Name: TARGET_REPO, Value: !GetAtt SourceRepository.CloneUrlHttp }
          - { Name: APP_ID, Value: !GetAtt App.AppId }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
                - npx -y aws-cdk@2 bootstrap "aws://$ACCOUNT/$AWS_REGION"
                - git config --global credential.helper '!aws codecommit credential-helper $@'
                - git config --global credential.UseHttpPath true
                - git clone --branch "$SOURCE_BRANCH" --single-branch "$SOURCE_REPO" src
                - cd src && git push "$TARGET_REPO" HEAD:refs/heads/main
                # Amplify builds on push; start a job only if the push did not trigger one.
                - sleep 45
                - |
                  if [ "$(aws amplify list-jobs --app-id "$APP_ID" --branch-name main --max-items 1 --query 'length(jobSummaries)' --output text)" = "0" ]; then
                    aws amplify start-job --app-id "$APP_ID" --branch-name main --job-type RELEASE
                  fi
      Tags: [{ Key: revenant:app, Value: revenant }]

  SeedStarterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-seed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt Seed.Arn

  SeedStarter:
    Type: AWS::Lambda::Function
    Properties:
      Description: Starts the rv-revenant-seed build when the install stack is created or updated.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt SeedStarterRole.Arn
      Code:
        ZipFile: |
          # cfnresponse is not bundled for python3.13, so reply to CloudFormation with urllib.
          import json, urllib.request, boto3
          def reply(event, context, status, reason=""):
              body = json.dumps({
                  "Status": status, "Reason": reason or "See " + context.log_stream_name,
                  "PhysicalResourceId": event.get("PhysicalResourceId") or "start-seed",
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": ""})
              urllib.request.urlopen(req, timeout=20)
          def handler(event, context):
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      boto3.client("codebuild").start_build(projectName=event["ResourceProperties"]["Project"])
                  reply(event, context, "SUCCESS")
              except Exception as e:
                  reply(event, context, "FAILED", str(e)[:200])

  StartSeed:
    Type: Custom::StartSeed
    DependsOn: [MainBranch]
    Properties:
      ServiceToken: !GetAtt SeedStarter.Arn
      ServiceTimeout: 300 # fail in 5 minutes instead of the default hour
      Project: !Ref Seed
      SourceBranch: !Ref SourceBranch # changing it re-runs the seed

Outputs:
  RevenantUrl:
    Description: Open this after the first Amplify build finishes (about 15 minutes). Sign in with the admin email.
    Value: !Sub https://main.${App.DefaultDomain}
  AmplifyAppId:
    Value: !GetAtt App.AppId
  KiroSecretArn:
    Description: Company Kiro key. The Amplify build passes it to the repair function as RV_KIRO_SECRET_ARN.
    Value: !Ref KiroSecret
  AppsComputeRoleArn:
    Description: SSR compute role of the generated apps (RV_APPS_COMPUTE_ROLE_ARN).
    Value: !GetAtt AppsComputeRole.Arn
  AmplifyConsole:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/amplify/apps/${App.AppId}/branches/main/deployments
  UpdateCommand:
    Description: Run this in CloudShell to update Revenant to the latest version.
    Value: !Sub aws codebuild start-build --project-name ${Seed}
